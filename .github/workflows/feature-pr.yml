name: Feature PR

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - "[0-9][0-9][0-9]-*"
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: feature-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  feature-pr:
    name: Create or update feature PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.workflow_run.event == 'push'
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Evaluate branch
        id: guard
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "::group::feature branch guard"
          if [[ "$HEAD_BRANCH" == "main" || "$HEAD_BRANCH" == "develop" ]]; then
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
            echo "Protected branch ignored."
            exit 0
          fi
          if [[ ! "$HEAD_BRANCH" =~ ^[0-9]{3}-[A-Za-z0-9._-]+$ ]]; then
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
            echo "Branch does not match Spec Kit pattern; ignored."
            exit 0
          fi
          git fetch --no-tags --depth=50 origin \
            "refs/heads/develop:refs/remotes/origin/develop" \
            "refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          if git diff --quiet "origin/develop...origin/${HEAD_BRANCH}"; then
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
            echo "No diff against develop; ignored."
            exit 0
          fi
          echo "create_pr=true" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Create or update PR
        if: steps.guard.outputs.create_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: develop
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR_TITLE: "feat: ${{ github.event.workflow_run.head_branch }}"
          PR_BODY_FILE: /tmp/feature-pr-body.md
          PR_LABELS: "feature,automated"
        run: |
          scripts/ci/feature-pr-body.sh > "$PR_BODY_FILE"
          scripts/ci/ensure-pr.sh

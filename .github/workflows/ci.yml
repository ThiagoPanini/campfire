name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - develop
      - main
      - "[0-9][0-9][0-9]-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' && github.ref_name != 'main' }}

jobs:
  frontend-checks:
    name: Frontend - typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: |
          echo "::group::npm ci"
          npm ci
          echo "::endgroup::"

      - name: Typecheck frontend
        run: |
          echo "::group::npm run typecheck"
          npm run typecheck
          echo "::endgroup::"

      - name: Build frontend
        run: |
          echo "::group::npm run build"
          npm run build
          echo "::endgroup::"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  backend-lint-typecheck:
    name: Backend - lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Sync backend dependencies
        run: |
          echo "::group::uv sync"
          uv sync --frozen
          echo "::endgroup::"

      - name: Ruff
        run: |
          echo "::group::ruff"
          uv run ruff check src tests scripts
          echo "::endgroup::"

      - name: Mypy warning pass
        continue-on-error: true
        run: |
          echo "::group::mypy"
          uv run mypy src || {
            echo "::warning::mypy reported issues; non-blocking until backend type cleanup is complete"
            exit 1
          }
          echo "::endgroup::"

  backend-unit:
    name: Backend - unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: |
          echo "::group::pytest unit"
          uv run pytest -m unit tests/unit
          echo "::endgroup::"

  backend-integration-postgres:
    name: Backend - integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campfire
          POSTGRES_PASSWORD: campfire
          POSTGRES_DB: campfire
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://campfire:campfire@localhost:5432/campfire
      TEST_DATABASE_URL: postgresql+asyncpg://campfire:campfire@localhost:5432/campfire
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: |
          echo "::group::alembic upgrade"
          uv run alembic upgrade head
          echo "::endgroup::"

      - name: Run integration tests
        run: |
          echo "::group::pytest integration"
          uv run pytest -m integration tests/integration
          echo "::endgroup::"

  migrations-contracts:
    name: Backend - migrations and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campfire
          POSTGRES_PASSWORD: campfire
          POSTGRES_DB: campfire
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://campfire:campfire@localhost:5432/campfire
      TEST_DATABASE_URL: postgresql+asyncpg://campfire:campfire@localhost:5432/campfire
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Validate migrations
        run: |
          echo "::group::alembic"
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          echo "::endgroup::"

      - name: Run contract tests
        run: |
          echo "::group::pytest contract"
          uv run pytest -m contract tests/contract
          echo "::endgroup::"

  docs-and-repo-hygiene:
    name: Docs and repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Branch policy checks
        run: |
          echo "::group::branch policy"
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != "develop" ]]; then
            echo "::error::PRs into main must come from develop"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "develop" && ! "${{ github.head_ref }}" =~ ^[0-9]{3}-[A-Za-z0-9._-]+$ ]]; then
            echo "::warning::Feature branch does not match Spec Kit pattern ###-feature-name"
          fi
          echo "::endgroup::"

      - name: Validate environment examples
        run: |
          echo "::group::.env examples"
          test -f apps/api/.env.example
          test -f apps/web/.env.local.example
          if grep -RE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|https://api\.render\.com/deploy/srv-)' apps/api/.env.example apps/web/.env.local.example; then
            echo "::error::.env example contains a value that looks secret"
            exit 1
          fi
          echo "::endgroup::"

      - name: Validate docs navigation
        run: |
          echo "::group::docs navigation"
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const docs = JSON.parse(fs.readFileSync("docs/docs.json", "utf8"));
          const missing = [];
          function visit(value) {
            if (Array.isArray(value)) {
              value.forEach(visit);
              return;
            }
            if (value && typeof value === "object") {
              if (value.root) visit(value.root);
              if (value.pages) visit(value.pages);
              return;
            }
            if (typeof value === "string") {
              const file = path.join("docs", `${value}.mdx`);
              if (!fs.existsSync(file)) missing.push(file);
            }
          }
          visit(docs.navigation?.tabs ?? []);
          if (missing.length) {
            console.error(`::error::Missing docs nav targets:\n${missing.join("\n")}`);
            process.exit(1);
          }
          NODE
          echo "::endgroup::"

      - name: Validate constitution
        run: |
          echo "::group::constitution"
          test -s .specify/memory/constitution.md
          echo "::endgroup::"

      - name: Diff-based secrets scan
        run: |
          echo "::group::secrets scan"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$base" ]]; then
            git diff --unified=0 "$base"...HEAD > /tmp/campfire.diff || git diff --unified=0 "$base" HEAD > /tmp/campfire.diff
            if grep -E '(^\+.*AKIA[0-9A-Z]{16}|^\+.*AIza[0-9A-Za-z_-]{20,}|^\+.*https://api\.render\.com/deploy/srv-[a-z0-9]{5,})' /tmp/campfire.diff; then
              echo "::error::Diff contains a high-confidence secret pattern"
              exit 1
            fi
          fi
          echo "::endgroup::"

  ci-status:
    name: CI status (aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs:
      - frontend-checks
      - backend-lint-typecheck
      - backend-unit
      - backend-integration-postgres
      - migrations-contracts
      - docs-and-repo-hygiene
    if: always()
    steps:
      - name: Require all CI jobs
        run: |
          results='${{ toJson(needs) }}'
          echo "$results"
          RESULTS="$results" node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const bad = Object.entries(needs).filter(([, job]) => job.result !== "success");
          if (bad.length) {
            for (const [name, job] of bad) {
              console.error(`::error::${name} finished with ${job.result}`);
            }
            process.exit(1);
          }
          console.log("All CI jobs succeeded.");
          NODE

  create-feature-pr:
    name: Create or update feature PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci-status
    if: ${{ github.event_name == 'push' && github.ref_name != 'develop' && github.ref_name != 'main' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Evaluate feature branch
        id: guard
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          echo "::group::feature branch guard"
          if [[ ! "$HEAD_BRANCH" =~ ^[0-9]{3}-[A-Za-z0-9._-]+$ ]]; then
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
            echo "Branch does not match Spec Kit pattern; ignored."
            exit 0
          fi
          git fetch --no-tags --depth=50 origin \
            "refs/heads/develop:refs/remotes/origin/develop" \
            "refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          if git diff --quiet "origin/develop...origin/${HEAD_BRANCH}"; then
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
            echo "No diff against develop; ignored."
            exit 0
          fi
          echo "create_pr=true" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Create or update PR
        if: steps.guard.outputs.create_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: develop
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          CI_CONCLUSION: success
          PR_TITLE: "feat: ${{ github.ref_name }}"
          PR_BODY_FILE: /tmp/feature-pr-body.md
          PR_LABELS: "feature,automated"
        run: |
          scripts/ci/feature-pr-body.sh > "$PR_BODY_FILE"
          scripts/ci/ensure-pr.sh

  deploy-develop:
    name: Deploy and probe develop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: ci-status
    if: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
    environment: develop
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v6

      - name: Verify develop values
        env:
          RENDER_DEVELOP_API_DEPLOY_HOOK: ${{ secrets.RENDER_DEVELOP_API_DEPLOY_HOOK }}
          RENDER_DEVELOP_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_DEVELOP_WEB_DEPLOY_HOOK }}
          DEVELOP_API_URL: ${{ vars.DEVELOP_API_URL }}
          DEVELOP_WEB_URL: ${{ vars.DEVELOP_WEB_URL }}
          PREFLIGHT_ENVIRONMENT: develop
        run: |
          scripts/ci/preflight-secrets.sh \
            RENDER_DEVELOP_API_DEPLOY_HOOK \
            RENDER_DEVELOP_WEB_DEPLOY_HOOK \
            DEVELOP_API_URL \
            DEVELOP_WEB_URL

      - name: Trigger Render API deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEVELOP_API_DEPLOY_HOOK }}
        run: scripts/ci/render-deploy.sh develop api

      - name: Trigger Render Web deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEVELOP_WEB_DEPLOY_HOOK }}
        run: scripts/ci/render-deploy.sh develop web

      - name: Probe develop URLs
        env:
          DEVELOP_API_URL: ${{ vars.DEVELOP_API_URL }}
          DEVELOP_WEB_URL: ${{ vars.DEVELOP_WEB_URL }}
          PROBE_MAX_ATTEMPTS: 45
          PROBE_SLEEP_SECONDS: 10
          PROBE_REQUEST_TIMEOUT: 10
        run: |
          api="${DEVELOP_API_URL%/}"
          web="${DEVELOP_WEB_URL%/}"
          scripts/ci/probe-url.sh "${api}/healthz" "develop api /healthz"
          scripts/ci/probe-url.sh "${api}/readyz" "develop api /readyz"
          scripts/ci/probe-url.sh "${web}/" "develop web"

  promotion-pr:
    name: Promote develop to main PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ci-status
      - deploy-develop
    if: ${{ github.event_name == 'push' && github.ref_name == 'develop' && needs['deploy-develop'].result == 'success' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Create or update promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          BASE_BRANCH: main
          HEAD_BRANCH: develop
          PR_TITLE: "chore(release): promote develop to main (${{ github.sha }})"
          PR_BODY_FILE: /tmp/promotion-pr-body.md
          PR_LABELS: "release-candidate,automated"
        run: |
          scripts/ci/promotion-pr-body.sh > "$PR_BODY_FILE"
          scripts/ci/ensure-pr.sh

  deploy-production:
    name: Deploy and probe production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: ci-status
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    environment: production
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v6

      - name: Verify production values
        env:
          RENDER_PROD_API_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_API_DEPLOY_HOOK }}
          RENDER_PROD_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_WEB_DEPLOY_HOOK }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          PROD_WEB_URL: ${{ vars.PROD_WEB_URL }}
          PREFLIGHT_ENVIRONMENT: production
          PREFLIGHT_DOCS_LINK: docs/backend/ops/cicd.mdx#provisioning-production
        run: |
          scripts/ci/preflight-secrets.sh \
            RENDER_PROD_API_DEPLOY_HOOK \
            RENDER_PROD_WEB_DEPLOY_HOOK \
            PROD_API_URL \
            PROD_WEB_URL

      - name: Trigger Render API deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_PROD_API_DEPLOY_HOOK }}
        run: scripts/ci/render-deploy.sh production api

      - name: Trigger Render Web deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_PROD_WEB_DEPLOY_HOOK }}
        run: scripts/ci/render-deploy.sh production web

      - name: Probe production URLs
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          PROD_WEB_URL: ${{ vars.PROD_WEB_URL }}
          PROBE_MAX_ATTEMPTS: 45
          PROBE_SLEEP_SECONDS: 10
          PROBE_REQUEST_TIMEOUT: 10
        run: |
          api="${PROD_API_URL%/}"
          web="${PROD_WEB_URL%/}"
          scripts/ci/probe-url.sh "${api}/healthz" "production api /healthz"
          scripts/ci/probe-url.sh "${api}/readyz" "production api /readyz"
          scripts/ci/probe-url.sh "${web}/" "production web"

  production-summary:
    name: Production deployment summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - ci-status
      - deploy-production
    if: ${{ always() && github.event_name == 'push' && github.ref_name == 'main' }}
    steps:
      - name: Summarize production deployment
        run: |
          {
            echo "## Production Deployment"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- CI status: \`${{ needs['ci-status'].result }}\`"
            echo "- Deploy and probes: \`${{ needs['deploy-production'].result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs['ci-status'].result }}" != "success" || "${{ needs['deploy-production'].result }}" != "success" ]]; then
            exit 1
          fi

name: Deploy Develop

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - develop
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  branch-guard:
    name: Develop branch guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_sha: ${{ steps.guard.outputs.deploy_sha }}
    steps:
      - name: Checkout guard scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Guard develop ref and CI result
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          echo "::group::develop guard"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_CONCLUSION" != "success" ]]; then
              echo "::error::Develop deploy requires successful CI"
              exit 1
            fi
            if [[ "$WORKFLOW_BRANCH" != "develop" ]]; then
              echo "::error::Develop deploy requires develop branch"
              exit 1
            fi
            current_sha="$(
              curl --silent --fail \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" |
              node -e 'let s = ""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const ref = JSON.parse(s); console.log(ref.object.sha); });'
            )"
            if [[ "$current_sha" != "$WORKFLOW_SHA" ]]; then
              echo "::error::Successful CI SHA is not the current develop tip"
              exit 1
            fi
            scripts/ci/require-ci-status.sh "$WORKFLOW_SHA" develop
            echo "deploy_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF_NAME_VALUE" != "develop" ]]; then
              echo "::error::Deploys to develop are only allowed from develop"
              exit 1
            fi
            scripts/ci/require-ci-status.sh "$GITHUB_SHA_VALUE" develop
            echo "deploy_sha=${GITHUB_SHA_VALUE}" >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

  deploy-develop:
    name: Deploy and probe develop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: branch-guard
    environment: develop
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs['branch-guard'].outputs.deploy_sha }}

      - name: Verify develop values
        env:
          RENDER_DEVELOP_API_DEPLOY_HOOK: ${{ secrets.RENDER_DEVELOP_API_DEPLOY_HOOK }}
          RENDER_DEVELOP_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_DEVELOP_WEB_DEPLOY_HOOK }}
          DEVELOP_API_URL: ${{ vars.DEVELOP_API_URL }}
          DEVELOP_WEB_URL: ${{ vars.DEVELOP_WEB_URL }}
          PREFLIGHT_ENVIRONMENT: develop
        run: |
          scripts/ci/preflight-secrets.sh \
            RENDER_DEVELOP_API_DEPLOY_HOOK \
            RENDER_DEVELOP_WEB_DEPLOY_HOOK \
            DEVELOP_API_URL \
            DEVELOP_WEB_URL

      - name: Trigger Render API deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEVELOP_API_DEPLOY_HOOK }}
        run: scripts/ci/render-deploy.sh develop api

      - name: Trigger Render Web deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEVELOP_WEB_DEPLOY_HOOK }}
        run: scripts/ci/render-deploy.sh develop web

      - name: Probe develop URLs
        env:
          DEVELOP_API_URL: ${{ vars.DEVELOP_API_URL }}
          DEVELOP_WEB_URL: ${{ vars.DEVELOP_WEB_URL }}
          PROBE_MAX_ATTEMPTS: 45
          PROBE_SLEEP_SECONDS: 10
          PROBE_REQUEST_TIMEOUT: 10
        run: |
          api="${DEVELOP_API_URL%/}"
          web="${DEVELOP_WEB_URL%/}"
          scripts/ci/probe-url.sh "${api}/healthz" "develop api /healthz"
          scripts/ci/probe-url.sh "${api}/readyz" "develop api /readyz"
          scripts/ci/probe-url.sh "${web}/" "develop web"

  promotion-pr:
    name: Promote develop to main PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - branch-guard
      - deploy-develop
    if: needs['deploy-develop'].result == 'success'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Create or update promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ needs['branch-guard'].outputs.deploy_sha }}
          BASE_BRANCH: main
          HEAD_BRANCH: develop
          PR_TITLE: "chore(release): promote develop to main (${{ needs['branch-guard'].outputs.deploy_sha }})"
          PR_BODY_FILE: /tmp/promotion-pr-body.md
          PR_LABELS: "release-candidate,automated"
        run: |
          scripts/ci/promotion-pr-body.sh > "$PR_BODY_FILE"
          scripts/ci/ensure-pr.sh

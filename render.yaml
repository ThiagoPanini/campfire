previews:
  generation: "off"

projects:
  - name: Campfire
    environments:
      - name: Develop
        services:
          - type: web
            runtime: python
            name: campfire-api-dev
            branch: develop
            rootDir: apps/api
            plan: free
            buildCommand: uv sync --frozen --no-dev
            startCommand: uv run alembic upgrade head && uv run uvicorn campfire_api.main:app --host 0.0.0.0 --port $PORT
            autoDeployTrigger: "off"
            healthCheckPath: /readyz
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: campfire-db-dev
                  property: connectionString
              - key: PYTHON_VERSION
                value: 3.12.12
              - key: ENV
                value: dev
              - key: LOG_LEVEL
                value: INFO
              - key: CORS_ORIGINS
                value: https://campfire-dev.onrender.com
              - key: TRUSTED_PROXIES
                sync: false
              - key: WEB_BASE_URL
                value: https://campfire-dev.onrender.com
              - key: ACCESS_TOKEN_TTL_SECONDS
                value: "900"
              - key: REFRESH_TOKEN_TTL_SECONDS
                value: "1209600"
              - key: REFRESH_COOKIE_NAME
                value: campfire_refresh
              - key: REFRESH_COOKIE_SECURE
                value: "true"
              - key: REFRESH_COOKIE_SAMESITE
                value: "none"
              - key: GOOGLE_STUB_ENABLED
                value: "false"
              - key: GOOGLE_OAUTH_ENABLED
                value: "true"
              - key: GOOGLE_OAUTH_CLIENT_ID
                sync: false
              - key: GOOGLE_OAUTH_CLIENT_SECRET
                sync: false
              - key: GOOGLE_OAUTH_REDIRECT_URI
                sync: false
              - key: OAUTH_FLOW_HMAC_KEY
                sync: false
              - key: OAUTH_FLOW_TTL_SECONDS
                value: "600"
              - key: EMAIL_CONFIRMATION_REQUIRED
                value: "true"
              - key: EMAIL_CONFIRMATION_HMAC_KEY
                sync: false
              - key: EMAIL_CONFIRMATION_TTL_SECONDS
                value: "900"
              - key: EMAIL_CONFIRMATION_MAX_ATTEMPTS
                value: "5"
              - key: EMAIL_CONFIRMATION_RESEND_COOLDOWN_SECONDS
                value: "60"
              - key: EMAIL_CONFIRMATION_RESEND_HOURLY_CAP
                value: "3"
              - key: MAIL_BACKEND
                value: console
              - key: MAIL_FROM
                sync: false
              - key: MAIL_OUTBOX_DIR
                value: tmp/mail
              - key: MAIL_HTTP_URL
                sync: false
              - key: MAIL_HTTP_API_KEY
                sync: false
              - key: RATE_LIMIT_PER_WINDOW
                value: "10"
              - key: RATE_LIMIT_WINDOW_SECONDS
                value: "300"
              - key: DEEZER_BASE_URL
                value: https://api.deezer.com
              - key: SEARCH_CACHE_TTL_SECONDS
                value: "60"
              - key: SEARCH_CACHE_MAX_ENTRIES
                value: "1024"
              - key: SEARCH_RATE_LIMIT_PER_WINDOW
                value: "30"
              - key: SEARCH_RATE_LIMIT_WINDOW_SECONDS
                value: "60"

          - type: web
            runtime: static
            name: campfire-dev
            branch: develop
            buildCommand: npm ci && npm run build
            staticPublishPath: apps/web/dist
            autoDeployTrigger: "off"
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: NODE_VERSION
                value: 22.22.0
              - key: VITE_API_URL
                value: https://campfire-api-dev.onrender.com

        databases:
          - name: campfire-db-dev
            plan: basic-256mb
            postgresMajorVersion: "16"
            databaseName: campfire_dev
            user: campfire

      - name: Production
        services:
          - type: web
            runtime: python
            name: campfire-api-prod
            branch: main
            rootDir: apps/api
            plan: starter
            buildCommand: uv sync --frozen --no-dev
            preDeployCommand: uv run alembic upgrade head
            startCommand: uv run uvicorn campfire_api.main:app --host 0.0.0.0 --port $PORT
            autoDeployTrigger: "off"
            healthCheckPath: /readyz
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: campfire-db-prod
                  property: connectionString
              - key: PYTHON_VERSION
                value: 3.12.12
              - key: ENV
                value: prod
              - key: LOG_LEVEL
                value: INFO
              - key: CORS_ORIGINS
                value: https://campfire-prod.onrender.com
              - key: TRUSTED_PROXIES
                sync: false
              - key: WEB_BASE_URL
                value: https://campfire-prod.onrender.com
              - key: ACCESS_TOKEN_TTL_SECONDS
                value: "900"
              - key: REFRESH_TOKEN_TTL_SECONDS
                value: "1209600"
              - key: REFRESH_COOKIE_NAME
                value: campfire_refresh
              - key: REFRESH_COOKIE_SECURE
                value: "true"
              - key: REFRESH_COOKIE_SAMESITE
                value: "none"
              - key: GOOGLE_STUB_ENABLED
                value: "false"
              - key: GOOGLE_OAUTH_ENABLED
                value: "true"
              - key: GOOGLE_OAUTH_CLIENT_ID
                sync: false
              - key: GOOGLE_OAUTH_CLIENT_SECRET
                sync: false
              - key: GOOGLE_OAUTH_REDIRECT_URI
                sync: false
              - key: OAUTH_FLOW_HMAC_KEY
                sync: false
              - key: OAUTH_FLOW_TTL_SECONDS
                value: "600"
              - key: EMAIL_CONFIRMATION_REQUIRED
                value: "true"
              - key: EMAIL_CONFIRMATION_HMAC_KEY
                sync: false
              - key: EMAIL_CONFIRMATION_TTL_SECONDS
                value: "900"
              - key: EMAIL_CONFIRMATION_MAX_ATTEMPTS
                value: "5"
              - key: EMAIL_CONFIRMATION_RESEND_COOLDOWN_SECONDS
                value: "60"
              - key: EMAIL_CONFIRMATION_RESEND_HOURLY_CAP
                value: "3"
              - key: MAIL_BACKEND
                value: http
              - key: MAIL_FROM
                sync: false
              - key: MAIL_OUTBOX_DIR
                value: tmp/mail
              - key: MAIL_HTTP_URL
                sync: false
              - key: MAIL_HTTP_API_KEY
                sync: false
              - key: RATE_LIMIT_PER_WINDOW
                value: "10"
              - key: RATE_LIMIT_WINDOW_SECONDS
                value: "300"
              - key: DEEZER_BASE_URL
                value: https://api.deezer.com
              - key: SEARCH_CACHE_TTL_SECONDS
                value: "60"
              - key: SEARCH_CACHE_MAX_ENTRIES
                value: "1024"
              - key: SEARCH_RATE_LIMIT_PER_WINDOW
                value: "30"
              - key: SEARCH_RATE_LIMIT_WINDOW_SECONDS
                value: "60"

          - type: web
            runtime: static
            name: campfire-prod
            branch: main
            buildCommand: npm ci && npm run build
            staticPublishPath: apps/web/dist
            autoDeployTrigger: "off"
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: NODE_VERSION
                value: 22.22.0
              - key: VITE_API_URL
                value: https://campfire-api-prod.onrender.com

        databases:
          - name: campfire-db-prod
            plan: basic-256mb
            postgresMajorVersion: "16"
            databaseName: campfire_prod
            user: campfire
